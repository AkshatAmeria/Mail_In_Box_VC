version: "3.9"

services:
  redis:
    image: redis:7
    container_name: scheduler-redis-1
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15
    container_name: scheduler-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"